spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nilebank}
    username: ${DB_USER:nilebank}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never


nilebank:
  finance:
    scheduler-enabled: ${FINANCE_SCHEDULER_ENABLED:true}
  fx:
    reference-provider: ${FX_REFERENCE_PROVIDER:cbm}
  auth:
    verification:
      enabled: ${EMAIL_VERIFICATION_ENABLED:false}
    mfa:
      enabled: ${MFA_ENABLED:false}
      keys-json: ${MFA_KEYS_JSON:}
      active-key-id: ${MFA_ACTIVE_KEY_ID:}
    recovery:
      enabled: ${RECOVERY_ENABLED:false}
      base-url: ${RECOVERY_BASE_URL:http://localhost:8080}
      from: ${RECOVERY_FROM:}
      smtp-host: ${RECOVERY_SMTP_HOST:}
      smtp-port: ${RECOVERY_SMTP_PORT:587}
      smtp-user: ${RECOVERY_SMTP_USER:}
      smtp-password: ${RECOVERY_SMTP_PASSWORD:}
      smtp-starttls: ${RECOVERY_SMTP_STARTTLS:true}
    google:
      enabled: ${GOOGLE_LOGIN_ENABLED:false}
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/login/oauth2/code/google}

# PostgreSQL uniqueness DETAIL messages may contain profile values; retain app event logs instead.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: OFF
