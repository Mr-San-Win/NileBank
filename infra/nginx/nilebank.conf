# Host-installed Nginx template: replace nilebank.example and certificate paths.
# App must stay bound to 127.0.0.1:8080. Verify its actual TCP proxy peer before
# setting TRUSTED_PROXY_REGEX; Docker bridge addresses differ between hosts.
limit_req_zone $binary_remote_addr zone=nilebank_auth:10m rate=10r/m;
log_format nilebank_safe '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
    listen 80;
    server_name nilebank.example;
    return 308 https://nilebank.example$request_uri;
}
server {
    listen 443 ssl;
    server_name nilebank.example;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/nilebank-access.log nilebank_safe;
    # Nginx error messages can contain request arguments: never retain them.
    error_log /dev/null crit;
    client_max_body_size 64k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host nilebank.example;
        proxy_set_header X-Forwarded-Host nilebank.example;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location ~ ^/(api/v1/auth/|oauth2/authorization/) {
        limit_req zone=nilebank_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host nilebank.example;
        proxy_set_header X-Forwarded-Host nilebank.example;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
