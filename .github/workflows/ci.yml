name: Build and PostgreSQL tests
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'docs/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify (PostgreSQL Testcontainers requires Docker)
        working-directory: backend
        run: sh mvnw -B clean verify
      - name: Check JavaScript syntax
        run: |
          for file in frontend/*.js; do
            node --check --input-type=module < "$file"
          done
          node scripts/check_currency_format.mjs
      - name: Build application image
        run: docker build -f backend/Dockerfile -t nilebank:ci .
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/
