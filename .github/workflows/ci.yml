name: Build and PostgreSQL tests
on:
  push:
    branches: [main, codex/nilebank-mvp]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify (PostgreSQL Testcontainers requires Docker)
        run: sh mvnw -B verify
      - name: Check JavaScript syntax
        run: node --check src/main/resources/static/app.js
      - name: Build application image
        run: docker build -t nilebank:ci .
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/
