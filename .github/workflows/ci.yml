name: Build and PostgreSQL tests
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'docs/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify (PostgreSQL Testcontainers requires Docker)
        working-directory: backend
        run: sh mvnw -B clean verify
      - name: Check JavaScript syntax
        run: |
          for file in frontend/*.js; do
            node --check --input-type=module < "$file"
          done
          node scripts/check_currency_format.mjs
      - name: Build runtime image from the tested JAR (no second Maven build)
        run: |
          mkdir -p .tools/release-image
          cp backend/target/nilebank-0.1.0.jar .tools/release-image/
          docker build -f backend/Dockerfile.runtime --build-arg REVISION="$GITHUB_SHA" -t nilebank:render-local .tools/release-image
      - name: Verify runtime image under 512 MB with a local TLS edge
        run: python3 scripts/verify_render.py
      - name: Preserve the verified JAR for publishing
        uses: actions/upload-artifact@v4
        with:
          name: verified-application
          path: backend/target/nilebank-0.1.0.jar
          if-no-files-found: error
          retention-days: 3
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: backend/target/surefire-reports/
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-application
          path: .tools/release-image
      - name: Resolve lowercase container name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified application image (not a deployment)
        uses: docker/build-push-action@v6
        with:
          context: .tools/release-image
          file: backend/Dockerfile.runtime
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:main
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
