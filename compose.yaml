services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vaultbank
      POSTGRES_USER: ${DB_USER:-vaultbank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d vaultbank"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/vaultbank
      DB_USER: ${DB_USER:-vaultbank}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

