services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-nilebank}
      POSTGRES_USER: ${DB_USER:-nilebank}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-nilebank}
      DB_USER: ${DB_USER:-nilebank}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FINANCE_SCHEDULER_ENABLED: ${FINANCE_SCHEDULER_ENABLED:-true}
      FX_REFERENCE_PROVIDER: ${FX_REFERENCE_PROVIDER:-cbm}
      EMAIL_VERIFICATION_ENABLED: ${EMAIL_VERIFICATION_ENABLED:-false}
      MFA_ENABLED: ${MFA_ENABLED:-false}
      MFA_KEYS_JSON: ${MFA_KEYS_JSON:-}
      MFA_ACTIVE_KEY_ID: ${MFA_ACTIVE_KEY_ID:-}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-false}
      RECOVERY_BASE_URL: ${RECOVERY_BASE_URL:-http://localhost:8080}
      RECOVERY_FROM: ${RECOVERY_FROM:-}
      RECOVERY_SMTP_HOST: ${RECOVERY_SMTP_HOST:-}
      RECOVERY_SMTP_PORT: ${RECOVERY_SMTP_PORT:-587}
      RECOVERY_SMTP_USER: ${RECOVERY_SMTP_USER:-}
      RECOVERY_SMTP_PASSWORD: ${RECOVERY_SMTP_PASSWORD:-}
      RECOVERY_SMTP_STARTTLS: ${RECOVERY_SMTP_STARTTLS:-true}
      GOOGLE_LOGIN_ENABLED: ${GOOGLE_LOGIN_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:

